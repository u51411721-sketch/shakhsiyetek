<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>شخصيتك مع مريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* Layout: one soft card. Sticker girl on top, question below, answers as a 2x2 grid of picture cards. */
  :root {
    --bg: #fff0f6;
    --dot: #ffd6e6;
    --surface: #ffffff;
    --ink: #4a2c4d;
    --muted: #7e5883;
    --line: #f3c6da;
    --bubble: #ffe3ee;
    --pink: #d6336c;
    --on-pink: #ffffff;
    --lilac: #b79cff;
    --pic1: #ffd6e6;
    --pic2: #e3d8ff;
    --pic3: #d4f2e7;
    --pic4: #ffe8c7;
    --storm: #6c4fd8;
    --moon: #2f73b8;
    --sun: #a8650a;
    --forest: #1f8a5b;
    --font-display: "Baloo Bhaijaan 2", "Tajawal", "Segoe UI", sans-serif;
    --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #271c3a; --dot: #33254a; --surface: #36284f; --ink: #fff1f7; --muted: #d9b8e0; --line: #55407a; --bubble: #4a3568;
      --pink: #ff7aa8; --on-pink: #2a1a3a; --lilac: #a58bff;
      --pic1: #5a3556; --pic2: #43396e; --pic3: #2f5a56; --pic4: #5e4a3a;
      --storm: #b5a4ff; --moon: #85bdf2; --sun: #ffc566; --forest: #5fd6a0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #271c3a; --dot: #33254a; --surface: #36284f; --ink: #fff1f7; --muted: #d9b8e0; --line: #55407a; --bubble: #4a3568;
    --pink: #ff7aa8; --on-pink: #2a1a3a; --lilac: #a58bff;
    --pic1: #5a3556; --pic2: #43396e; --pic3: #2f5a56; --pic4: #5e4a3a;
    --storm: #b5a4ff; --moon: #85bdf2; --sun: #ffc566; --forest: #5fd6a0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 2px, transparent 2.5px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    padding-inline: 16px;
    padding-block: 20px 36px;
    min-height: 100%;
  }
  .wrap { max-width: 480px; margin-inline: auto; }

  .langs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .chip {
    font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); border-radius: 999px;
    padding: 4px 16px; cursor: pointer; touch-action: manipulation;
  }
  .chip[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: var(--on-pink); }
  .chip:focus-visible, .go:focus-visible, .opt:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }

  .card { background: var(--surface); border: 3px solid var(--line); border-radius: 32px; padding: 22px 16px 20px; text-align: center; }

  .sticker { width: 130px; margin-inline: auto; animation: float 3.2s ease-in-out infinite; }
  .sticker.small { width: 110px; }
  .sticker img { border-radius: 22px; }
  .sticker svg, .sticker img { display: block; width: 100%; height: auto; filter: drop-shadow(0 4px 0 rgba(74, 44, 77, .18)); animation: pop .4s ease-out; }

  .sticker.photo { width: auto; }
  .sticker.photo img { width: auto; height: 140px; max-width: 100%; margin-inline: auto; }
  .sticker.photo.small img { height: 112px; }

  h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.25; margin: 12px 0 8px; text-wrap: balance; }
  h1 { font-size: clamp(2rem, 9vw, 2.6rem); }
  h2 { font-size: clamp(1.35rem, 6vw, 1.7rem); }
  .lead { font-size: 1.1rem; margin: 0 0 16px; text-wrap: balance; }

  .go {
    font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1;
    background: var(--pink); color: var(--on-pink); border: 0; border-radius: 999px;
    padding: 16px 44px; cursor: pointer; box-shadow: 0 5px 0 rgba(74, 44, 77, .22); touch-action: manipulation;
  }
  .go:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(74, 44, 77, .22); }

  .tn { background: var(--bubble); border-radius: 20px; padding: 10px 16px; margin: 0 0 18px; font-weight: 500; line-height: 1.7; text-wrap: balance; direction: rtl; }
  .progress { color: var(--muted); font-size: .92rem; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .bar span { display: block; height: 100%; background: var(--pink); transition: width .4s ease; }

  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .opt {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 2px solid var(--line); border-radius: 18px; padding: 8px 8px 10px;
    cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0;
    text-align: center; touch-action: manipulation; transition: border-color .15s, transform .15s;
  }
  .opt:hover { border-color: var(--pink); }
  .opt.picked { border-color: var(--pink); transform: scale(.97); }
  .pic {
    display: grid; place-items: center; aspect-ratio: 4 / 3; max-width: 100%;
    border-radius: 12px; overflow: hidden; font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; color: var(--ink);
  }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .opt:nth-child(1) .pic { background: var(--pic1); }
  .opt:nth-child(2) .pic { background: var(--pic2); }
  .opt:nth-child(3) .pic { background: var(--pic3); }
  .opt:nth-child(4) .pic { background: var(--pic4); }
  .txt { font-size: .98rem; line-height: 1.45; overflow-wrap: anywhere; }

  .badge { width: 84px; height: 84px; margin: 4px auto 0; }
  .verdict { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 10vw, 3rem); line-height: 1.1; margin: 6px 0 6px; }
  .verdict.S { color: var(--storm); } .verdict.M { color: var(--moon); } .verdict.U { color: var(--sun); } .verdict.F { color: var(--forest); }
  .desc { font-size: 1.1rem; margin: 0 0 16px; text-wrap: balance; }
  .rows { display: grid; gap: 8px; margin: 0 0 14px; text-align: start; }
  .row { display: grid; grid-template-columns: 5.5rem 1fr 2.6rem; gap: 8px; align-items: center; font-size: .95rem; }
  .row .track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .row .fill { display: block; height: 100%; border-radius: 5px; }
  .row .pct { font-variant-numeric: tabular-nums; color: var(--muted); text-align: end; }
  .fill.S { background: var(--storm); } .fill.M { background: var(--moon); } .fill.U { background: var(--sun); } .fill.F { background: var(--forest); }
  .note { color: var(--muted); font-size: .9rem; margin: 14px 0 0; }

  @keyframes pop { 0% { transform: scale(.6) rotate(-8deg); } 60% { transform: scale(1.08) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) {
    .sticker, .sticker svg, .sticker img { animation: none; }
    .bar span, .opt { transition: none; }
  }
</style>

<div class="wrap" id="wrap" dir="rtl" lang="ar">
  <nav class="langs" aria-label="Language">
    <button class="chip" type="button" data-lang="ar">العربية</button>
    <button class="chip" type="button" data-lang="fr">Français</button>
    <button class="chip" type="button" data-lang="en">English</button>
  </nav>
  <main class="card" id="card"></main>
</div>

    { q: ["لديك نصف ساعة بلا هاتف وبلا أحد. ماذا تفعل؟", "Tu as une demi-heure sans téléphone et sans personne. Que fais-tu ?", "You have half an hour with no phone and nobody around. What do you do?"],

          ["U", "أغني بصوت عالٍ وأرقص", "Je chante à tue-tête et je danse", "Sing loudly and dance"],
          ["F", "أتمشى في الطبيعة وأتأمل", "Je me promène dans la nature", "Walk in nature and look around"],
          ["S", "أركض وأفرغ كل طاقتي", "Je cours et je dépense toute mon énergie", "Run and burn all my energy"]] },
    { q: ["عليك اختيار رفيق خيالي لمغامرتك. من تختار؟", "Tu dois choisir un compagnon imaginaire pour ton aventure. Qui prends-tu ?", "You must pick an imaginary buddy for your adventure. Who do you choose?"],
      o: [["U", "نجمة صغيرة تضحك دائمًا", "Une petite étoile qui rit tout le temps", "A little star that always laughs"],
          ["S", "تنينًا صغيرًا ينفث النار", "Un petit dragon qui crache du feu", "A tiny dragon that breathes fire"],
          ["F", "دبًّا كبيرًا وحنونًا", "Un gros ours très doux", "A big, gentle bear"],
          ["M", "بومة تعرف كل الأسرار", "Un hibou qui connaît tous les secrets", "An owl that knows every secret"]] },
    { q: ["يمكنك امتلاك قدرة خارقة ليوم واحد. ماذا تختار؟", "Tu peux avoir un super-pouvoir pour une journée. Lequel choisis-tu ?", "You can have a superpower for one day. Which one do you pick?"],
      o: [["F", "التحدث مع الحيوانات", "Parler aux animaux", "Talk to animals"],
          ["S", "السرعة الخارقة", "La super vitesse", "Super speed"],
          ["U", "جعل الجميع يضحكون", "Faire rire tout le monde", "Make everyone laugh"],
          ["M", "قراءة الأفكار", "Lire dans les pensées", "Read minds"]] },
    { q: ["متى تشعر أنك في أفضل حالاتك؟", "Quand te sens-tu au meilleur de toi-même ?", "When do you feel at your best?"],
      o: [["U", "عندما أكون بين الناس الذين أحبهم", "Quand je suis entouré(e) de gens que j'aime", "When I'm around people I love"],
          ["M", "عندما أجلس وحدي وأفكر", "Quand je suis seul(e) et que je réfléchis", "When I'm alone and thinking"],
          ["S", "عندما أجرّب شيئًا جديدًا ومجنونًا", "Quand j'essaie quelque chose de nouveau et de fou", "When I try something new and crazy"],
          ["F", "عندما أكون قرب أشخاص أثق بهم", "Quand je suis près de personnes en qui j'ai confiance", "When I'm close to people I trust"]] },
    { q: ["أي جملة تعبّر عنك أكثر؟", "Quelle phrase te ressemble le plus ?", "Which sentence describes you best?"],
      o: [["S", "لا أخاف من التحدي", "Je n'ai pas peur des défis", "I'm not afraid of a challenge"],
          ["F", "الصدق أهم شيء", "L'honnêteté avant tout", "Honesty matters most"],
          ["M", "في الهدوء قوة", "Il y a de la force dans le calme", "There is power in calm"],
          ["U", "الضحك يحلّ كل شيء", "Le rire règle tout", "Laughter fixes everything"]] }
  ];

  /* ============ النتائج ============ */
  var RESULTS = {
    S: { name: ["العاصفة", "La Tempête", "The Storm"],
         text: ["أنت عاصفة: تحب المغامرة، ولا تخاف من التحدي، وأينما ذهبت تغيّر الجو.", "Tu es une tempête : tu aimes l'aventure, tu n'as pas peur des défis et tu changes l'ambiance partout où tu passes.", "You are a storm: you love adventure, you aren't afraid of a challenge, and the mood changes wherever you go."] },
    M: { name: ["القمر", "La Lune", "The Moon"],
         text: ["أنت قمر: تعيش في عالمك الخاص، تتأمل وتحلم وتفهم الناس بعمق.", "Tu es la lune : tu vis dans ton monde, tu rêves, tu réfléchis et tu comprends les gens en profondeur.", "You are the moon: you live in your own world, you dream, you think deeply and you understand people."] },
    U: { name: ["الشمس", "Le Soleil", "The Sun"],
         text: ["أنت شمس: تنشر الفرح أينما ذهبت، وتجعل الجميع يضحكون بوجودك.", "Tu es le soleil : tu répands la joie partout et tout le monde rit en ta présence.", "You are the sun: you spread joy everywhere and make everyone laugh just by being there."] },
    F: { name: ["الغابة", "La Forêt", "The Forest"],
         text: ["أنت غابة: تحب الطبيعة والحيوانات، وتبقى وفيًّا لمن تحب، ويشعر الناس بالأمان قربك.", "Tu es la forêt : tu aimes la nature et les animaux, tu restes fidèle à ceux que tu aimes et les gens se sentent en sécurité près de toi.", "You are the forest: you love nature and animals, you stay loyal to those you love, and people feel safe near you."] }
  };

  /* ============ الستيكر: بنت صغيرة (مؤقتة حتى تبعثي ستيكرزك) ============ */
  function face(expr) {
    var dark = "#4a2c3a";
    var line = 'stroke="' + dark + '" stroke-width="3.5" stroke-linecap="round" fill="none"';
    var eyeOpen = '<circle cx="46" cy="68" r="5.5" fill="#3b2230"/><circle cx="74" cy="68" r="5.5" fill="#3b2230"/><circle cx="47.8" cy="66" r="1.9" fill="#fff"/><circle cx="75.8" cy="66" r="1.9" fill="#fff"/>';
    var eyeHappy = '<path d="M38 70 Q46 58 54 70" ' + line + '/><path d="M66 70 Q74 58 82 70" ' + line + '/>';
    var smile = '<path d="M47 83 Q60 95 73 83" ' + line + '/>';
    var heart = function (x, y, s) {
      return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><path d="M0 -3 C-5 -10 -14 -2 0 8 C14 -2 5 -10 0 -3Z" fill="#ff6f9c" stroke="' + dark + '" stroke-width="1.5"/></g>';
    };
    var eyes = eyeOpen, mouth = smile, extra = "";
    if (expr === "laugh") {
      eyes = eyeHappy;
      mouth = '<path d="M43 80 Q60 108 77 80 Z" fill="#8f2a45" stroke="' + dark + '" stroke-width="3" stroke-linejoin="round"/><path d="M50 94 Q60 86 70 94 Q60 101 50 94Z" fill="#ff8fa8"/>';
      extra = '<path d="M33 74 q-6 7 0 11 q6 -4 0 -11z" fill="#8ad8ff"/><path d="M87 74 q6 7 0 11 q-6 -4 0 -11z" fill="#8ad8ff"/>';
    } else if (expr === "wink") {
      eyes = '<circle cx="46" cy="68" r="5.5" fill="#3b2230"/><circle cx="47.8" cy="66" r="1.9" fill="#fff"/><path d="M66 70 Q74 58 82 70" ' + line + '/>';
      mouth = '<path d="M46 82 Q60 96 74 82" ' + line + '/><path d="M62 90 q1 12 10 9 q4 -7 -3 -12z" fill="#ff7f9d" stroke="' + dark + '" stroke-width="2.5" stroke-linejoin="round"/>';
      extra = heart(100, 40, 0.8);
    } else if (expr === "giggle") {
      eyes = eyeHappy;
      mouth = '<path d="M45 82 Q60 100 75 82 Q60 87 45 82Z" fill="#8f2a45" stroke="' + dark + '" stroke-width="3" stroke-linejoin="round"/>';
      extra = '<path d="M102 38 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z" fill="#ffd54f" stroke="' + dark + '" stroke-width="1.2"/><path d="M18 50 l2 5.5 5.5 2 -5.5 2 -2 5.5 -2 -5.5 -5.5 -2 5.5 -2z" fill="#ffd54f" stroke="' + dark + '" stroke-width="1.2"/>';
    } else if (expr === "happy") {
      mouth = '<path d="M46 82 Q60 98 74 82" ' + line + '/>';
      extra = heart(100, 36, 1) + heart(18, 52, 0.7);
    } else {
      extra = heart(100, 36, 0.9);
    }
    var hair = "#5b3a29";
    return '<svg viewBox="-4 -4 128 128" aria-hidden="true">' +
      '<circle cx="60" cy="62" r="62" fill="#fff"/>' +
      '<circle cx="26" cy="30" r="15" fill="' + hair + '" stroke="' + dark + '" stroke-width="3"/>' +
      '<circle cx="94" cy="30" r="15" fill="' + hair + '" stroke="' + dark + '" stroke-width="3"/>' +
      '<circle cx="60" cy="68" r="42" fill="#ffd9c2" stroke="' + dark + '" stroke-width="3"/>' +
      '<path d="M18 66 C14 30 42 20 60 20 C78 20 106 30 102 66 C94 48 80 42 60 42 C40 42 26 48 18 66Z" fill="' + hair + '" stroke="' + dark + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<circle cx="31" cy="38" r="5" fill="#ff6f9c" stroke="' + dark + '" stroke-width="2"/><circle cx="89" cy="38" r="5" fill="#ff6f9c" stroke="' + dark + '" stroke-width="2"/>' +
      '<ellipse cx="35" cy="80" rx="8" ry="5" fill="#ff9bb3" opacity=".75"/><ellipse cx="85" cy="80" rx="8" ry="5" fill="#ff9bb3" opacity=".75"/>' +
      eyes + mouth + extra + '</svg>';
  }

  /* أيقونات النتائج */
  function badge(type) {
    var d = "#4a2c3a";
    if (type === "S") {
      return '<svg class="badge" viewBox="0 0 64 64" aria-hidden="true"><g fill="#b9a6ff"><circle cx="22" cy="30" r="10"/><circle cx="35" cy="24" r="13"/><circle cx="46" cy="32" r="9"/><rect x="22" y="30" width="24" height="11" rx="5"/></g><polygon points="34,38 25,53 33,53 29,63 43,46 35,46 39,38" fill="#ffd54f" stroke="' + d + '" stroke-width="2" stroke-linejoin="round"/></svg>';
    }
    if (type === "M") {
      return '<svg class="badge" viewBox="0 0 64 64" aria-hidden="true"><path d="M42 8 A24 24 0 1 0 56 44 A19 19 0 1 1 42 8Z" fill="#ffe08a" stroke="' + d + '" stroke-width="2" stroke-linejoin="round"/><path d="M50 14 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z" fill="#ffd54f" stroke="' + d + '" stroke-width="1"/></svg>';
    }
    if (type === "U") {
      var rays = "";
      for (var i = 0; i < 8; i++) {
        var a = i * Math.PI / 4;
        rays += '<line x1="' + (32 + 20 * Math.cos(a)).toFixed(1) + '" y1="' + (32 + 20 * Math.sin(a)).toFixed(1) + '" x2="' + (32 + 28 * Math.cos(a)).toFixed(1) + '" y2="' + (32 + 28 * Math.sin(a)).toFixed(1) + '" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>';
      }
      return '<svg class="badge" viewBox="0 0 64 64" aria-hidden="true">' + rays + '<circle cx="32" cy="32" r="14" fill="#ffd54f" stroke="' + d + '" stroke-width="2"/></svg>';
    }
    return '<svg class="badge" viewBox="0 0 64 64" aria-hidden="true"><rect x="28" y="46" width="6" height="12" fill="#8a5a3c"/><polygon points="14,48 28,16 42,48" fill="#4cc38a" stroke="' + d + '" stroke-width="2" stroke-linejoin="round"/><polygon points="34,54 46,28 58,54" fill="#2f9e6b" stroke="' + d + '" stroke-width="2" stroke-linejoin="round"/><rect x="44" y="52" width="5" height="9" fill="#8a5a3c"/></svg>';
  }

  /* ============ المنطق ============ */
  var lang = "ar", screen = "start", qi = 0, picks = [], locked = false;
  var FACES = ["giggle", "wink", "laugh", "happy", "hello"];
  var $ = function (id) { return document.getElementById(id); };
  var card = $("card"), wrap = $("wrap");

  function sticker(slot, expr, small) {
    var src = STICKER_IMAGES[slot];
    var inner = src ? '<img src="' + src + '" alt="">' : face(expr);
    return '<div class="sticker' + (small ? " small" : "") + (src ? " photo" : "") + '">' + inner + '</div>';
  }

  function render() {
    var u = UI[lang], li = LANGS.indexOf(lang);
    wrap.dir = u.dir;
    wrap.lang = lang;
    document.querySelectorAll(".chip").forEach(function (c) {
      c.setAttribute("aria-pressed", c.getAttribute("data-lang") === lang ? "true" : "false");
    });

    if (screen === "start") {
      card.innerHTML = sticker("welcome", "hello") +
        '<h1>' + u.welcome + '</h1><p class="lead">' + u.about + '</p>' +
        '<p class="tn">' + TN_TEXT + '</p>' +
        '<button class="go" id="go" type="button">' + u.start + '</button>';
      $("go").addEventListener("click", function () { screen = "quiz"; qi = 0; picks = []; render(); });
    } else if (screen === "quiz") {
      var q = QUESTIONS[qi];
      var opts = q.o.map(function (o, k) {
        var key = "q" + (qi + 1) + "abcd"[k];
        var img = OPTION_IMAGES[key];
        var pic = img ? '<span class="pic"><img src="' + img + '" alt=""></span>' : '<span class="pic" aria-hidden="true">' + u.letters[k] + '</span>';
        return '<button class="opt" type="button" data-k="' + k + '">' + pic + '<span class="txt">' + o[1 + li] + '</span></button>';
      }).join("");
      card.innerHTML =
        '<p class="progress">' + u.q + " " + (qi + 1) + " / " + QUESTIONS.length + '</p>' +
        '<div class="bar"><span style="width:' + (qi / QUESTIONS.length * 100) + '%"></span></div>' +
        sticker(STICKER_IMAGES["q" + (qi + 1)] ? "q" + (qi + 1) : "question", FACES[qi % FACES.length], true) +
        '<h2>' + q.q[li] + '</h2><div class="opts">' + opts + '</div>';
      locked = false;
      card.querySelectorAll(".opt").forEach(function (b) {
        b.addEventListener("click", function () { pick(b, Number(b.getAttribute("data-k"))); });
      });
    } else {
      var counts = { S: 0, M: 0, U: 0, F: 0 }, last = { S: -1, M: -1, U: -1, F: -1 };
      picks.forEach(function (t, i) { counts[t] += 1; last[t] = i; });
      var win = "S";
      ["S", "M", "U", "F"].forEach(function (t) {
        if (counts[t] > counts[win] || (counts[t] === counts[win] && last[t] > last[win])) win = t;
      });
      var res = RESULTS[win];
      var rows = ["S", "M", "U", "F"].map(function (t) {
        var p = Math.round(counts[t] / QUESTIONS.length * 100);
        return '<div class="row"><span>' + RESULTS[t].name[li] + '</span><span class="track"><span class="fill ' + t + '" style="width:' + p + '%"></span></span><span class="pct">' + p + '%</span></div>';
      }).join("");
      card.innerHTML = sticker(STICKER_IMAGES["r" + win] ? "r" + win : "result", "happy") + badge(win) +
        '<p class="verdict ' + win + '">' + res.name[li] + '</p>' +
        '<p class="desc">' + res.text[li] + '</p>' +
        '<div class="rows">' + rows + '</div>' +
        '<button class="go" id="again" type="button">' + u.again + '</button>' +
        '<p class="note">' + u.fun + '</p>';
      $("again").addEventListener("click", function () { screen = "start"; render(); });
    }
  }

  function pick(button, k) {
    if (locked) return;
    locked = true;
    button.classList.add("picked");
    picks.push(QUESTIONS[qi].o[k][0]);
    setTimeout(function () {
      qi += 1;
      screen = qi < QUESTIONS.length ? "quiz" : "result";
      render();
    }, 450);
  }

  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () { lang = c.getAttribute("data-lang"); render(); });
  });
  render();
</script>

</body></html>
